<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Wura — W">
  <title>Wura</title>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Fond Navy Deep — brand book negatif (Ivory + trait or sur Navy) -->
  <rect width="256" height="256" rx="48" fill="#0a0e1a"/>

  <!-- Signe seul « W » Space Grotesk bold droit (même police que le site et l'app) -->
  <text x="128" y="158" text-anchor="middle"
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-style="normal"
        font-weight="700"
        font-size="150"
        letter-spacing="-4"
        fill="#f5efe0">W</text>

  <!-- Trait d'or centré sous le W — signature « Le Trait » -->
  <rect x="83" y="184" width="90" height="9" rx="2" fill="#d4a24e"/>
</svg>
