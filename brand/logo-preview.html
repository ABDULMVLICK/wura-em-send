<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #0a0e1a;
      font-family: 'Space Grotesk', sans-serif;
    }
    .stage {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(212, 160, 23, 0.28) 0%, transparent 55%),
        radial-gradient(circle at 30% 35%, rgba(234, 179, 8, 0.18) 0%, transparent 35%),
        radial-gradient(circle at 70% 65%, rgba(184, 134, 11, 0.15) 0%, transparent 35%),
        #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Subtle noise overlay */
    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px;
      opacity: 0.07;
      mix-blend-mode: overlay;
    }
    /* Inner safe-area ring (invisible, just for reference - not rendered) */
    .wordmark {
      position: relative;
      z-index: 2;
      text-align: center;
      line-height: 0.85;
    }
    .wordmark .w {
      display: block;
      font-size: 740px;
      font-weight: 800;
      letter-spacing: -0.07em;
      background: linear-gradient(135deg, #f4d35e 0%, #eab308 30%, #d4a017 60%, #b8860b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 30px 80px rgba(212, 160, 23, 0.45));
      text-shadow: none;
    }
    .wordmark .ura {
      display: block;
      font-size: 130px;
      font-weight: 700;
      letter-spacing: 0.55em;
      color: #f8fafc;
      text-transform: uppercase;
      margin-top: 6px;
      margin-left: 0.55em; /* compensate letter-spacing */
      opacity: 0.92;
    }
    /* Top-left accent diamond */
    .accent {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: #d4a017;
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 0 0 30px rgba(212, 160, 23, 0.8);
      border-radius: 3px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="accent" aria-hidden="true"></div>
    <div class="wordmark">
      <span class="w">W</span>
      <span class="ura">ura</span>
    </div>
  </div>
</body>
</html>
